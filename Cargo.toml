[workspace]
resolver = "3"
members = [
  "crates/*"
]

default-members = [
  "crates/*"
]

[workspace.package]
version = "0.1.0"
authors = []
edition = "2024"
license = "MIT"
repository = "https://github.com/lmeller-git/ast-testcase-reduce"

[workspace.dependencies]
sqlparser = { path = "extern/sqlparser-rs", features = ["serde", "visitor", "arbitrary-derive"] }
serde = "1.0.228"
rand = "0.10.0"

[patch.crates-io]
sqlparser = { path = "extern/sqlparser-rs" }

[profile.release]
lto = "fat"
codegen-units = 1
# debug = true
